name: CI

# -----------------------------------------------------------------------------
# TRIGGER ON EVERY BRANCH, AND CANCEL SUPERSEDED RUNS. [Josh, S107b — one change]
# -----------------------------------------------------------------------------
# These two edits are ONE ruling and must not be separated. Branch triggers on
# their own multiply runs and make the collision below WORSE; the concurrency
# group on its own leaves the signal arriving too late. Together they are net
# FEWER concurrent runs than the config they replace.
#
# WHY BRANCH TRIGGERS (§14a). Every red in the S107 campaign appeared AFTER the
# merge that caused it — the streak from #290 ran four merges deep before
# anything surfaced. That is not a discipline failure, it is what
# `branches: [main, dev]` ALLOWS: pushing and merging happen in one sequence, so
# a signal scoped to main always arrives behind the merge it was meant to gate.
# Triggering on any branch puts the red in FRONT of the merge. It costs no extra
# discipline, because the unattended-run rule (CLAUDE.md, S105/S173) already
# requires a push after every commit — the pushes were happening; nothing was
# watching them.
#
# `'**'` NOT `'*'`, AND THE DIFFERENCE IS LOAD-BEARING. `'*'` does not match a
# branch name containing a slash, and this repo's convention is
# `feature/...`, `fix/...`, `docs/...` — i.e. `'*'` would silently match
# almost nothing we actually push.
#
# WHY THE CONCURRENCY GROUP (§14b). There was no `concurrency:` key in this file
# at all before this commit — every occurrence of that word was prose in the
# comments below. That absence is why runs #303 and #304 coexisted and drove the
# one shared rebuild-test database simultaneously: `m-capture-camera`'s afterAll
# deletes `files` rows matching `shot%` for the fixture project, `m-writes`
# creates and deletes PM-authored change orders that `desktop-payload` reads,
# and `workers: 1` — load-bearing, see below — cannot see a SECOND RUN. Nor
# could it be cleaned up by hand: the Codespace GITHUB_TOKEN lacks
# `actions:write`, so cancelling returns 403. The fix has to be declarative.
#
# THE GROUP KEY IS `head_ref || ref_name`, DELIBERATELY, and this is the detail
# that makes the pair work. Once a PR is open, one push fires BOTH a `push` and
# a `pull_request` event. Grouping on `github.ref` would put them in DIFFERENT
# groups — `refs/heads/X` vs `refs/pull/N/merge` — so both would run, against
# one database, which is the #303/#304 collision reintroduced by the very change
# meant to end it. `github.head_ref` is set only on pull_request and holds the
# HEAD branch; `github.ref_name` is the branch on push. Together they resolve to
# the same string for both events, so the two collapse into one group and the
# newest wins.
#
# CANCELLING APPLIES TO main TOO, and that is considered rather than overlooked.
# A cancelled run is only ever one superseded by a NEWER run of the same branch,
# so there is always a most-recent run for the current state. On main the state
# that matters is main's tip, and the newer run tests a tree that INCLUDES the
# commit whose run was cancelled. The only thing lost is a result for an
# intermediate commit that no longer represents main.
#
# THE PUSH-HOLD EXCEPTION IS NOT BEING WRITTEN INTO THE RULE. S107 §14b proposed
# one — hold the push while a run is in progress, batch and send on a terminal
# state — because the unattended-push rule and a running CI job were in direct
# conflict. `cancel-in-progress` dissolves that conflict at the source: a
# superseded run CANCELS rather than competes, so there is nothing to hold for.
# Recorded because it was proposed and reasoned about, and a future reader
# should know it was made unnecessary rather than forgotten. [Josh, S107b]
#
# ⚠️ AND THE ASYMMETRY THAT MADE THE COLLISIONS SURVIVABLE, kept because it is
# what lets a result from a contaminated window still be acted on: CONTENTION
# MANUFACTURES FALSE REDS, NEVER FALSE GREENS. Nothing about interference makes
# a failing assertion pass. So a GREEN is trustworthy even if another run
# overlapped it — CI #304 is green on exactly this reasoning — and only a RED
# needs the question "was anything else running?" asked before it is believed.
#
# Cross-ref TECH_DEBT #157, and #150 for the shared-fixture exposure list.
# -----------------------------------------------------------------------------
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

# ⚠️ TECH_DEBT #137 [S122] — EVERY `run:` STEP GETS `pipefail`.
#
# GitHub's default shell for `run:` is `bash -e {0}`: NO `pipefail`. So any step
# that pipes — `npx next build | tail -20` is the instance that actually shipped
# — is judged by the LAST command's status. `tail` always exits 0, so a failed
# build reports success and the job goes GREEN. Locally that costs a re-run; in
# CI it ships red as green, the branch looks mergeable, and nothing downstream
# re-checks.
#
# `-o pipefail` makes a pipeline fail if ANY stage fails. `-u` fails on an unset
# variable rather than silently substituting empty — the same class of defect
# (a typo'd secret name becoming ""). `{0}` is the script path GitHub
# substitutes; it must be kept.
#
# This closes the PIPE half of #137 workflow-wide. It does NOT close the
# trailing-command half — `cmd; echo "exit: $?"` still reports the echo's
# status, and nothing but not writing it fixes that. See CLAUDE.md → "Reading
# the exit status of a command" for the rules that apply to every command run
# in this repo, CI or not.
defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  check:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint web
        run: npx turbo run lint --filter=@framefocus/web

      # ADDED [S99]. The committed vitest suite (297 tests) was not running in
      # CI at all — this job did type-check and lint only. Nothing about
      # Playwright required fixing that, but adding a second test surface while
      # the first one never ran would have been the wrong shape. Cheap: no
      # browser, no server, no secrets.
      - name: Unit tests (vitest)
        run: npx turbo run test --filter=@framefocus/web

  # ---------------------------------------------------------------------------
  # SEPARATE JOB, deliberately.
  #
  # e2e needs ~656 MB of browser binaries, Chromium's system libraries, and a
  # running Next dev server. `check` needs none of that and finishes in a
  # fraction of the time. Folding them together would make every lint failure
  # wait on a browser download, and would let an e2e flake mask a type error.
  # Separate jobs also run in parallel.
  # ---------------------------------------------------------------------------
  # ---------------------------------------------------------------------------
  # UN-SHARDED, DELIBERATELY — the sharding of S133 was REVERTED. [Josh, S134]
  # ---------------------------------------------------------------------------
  # Sharding (S133, commit ce6efa8) ran four runners against the ONE shared
  # rebuild-test database. To that database the four shards are CONCURRENT runs,
  # which is the exact hazard #198/#199/#200 were sequenced to avoid — carried,
  # unnoticed, across the shard boundary. It surfaced as CI #201: a PM-authored
  # `net_delta:0` change order created by `m-co-recalc-route.spec.ts` on shard N
  # was read by `desktop-payload.spec.ts:175` on shard 1, failing an
  # assert-absence. Not a payload leak — a test that asserts the ABSENCE / count
  # of something another shard writes to a shared fixture. See TECH_DEBT for the
  # full exposed set.
  #
  # THE REASONING, so it is not re-litigated: the only two speedups available —
  # sharding, and `workers > 1` in one job — BOTH introduce that same intra-DB
  # concurrency. Absent per-shard fixture isolation, SERIAL is the only correct
  # configuration and the wall-clock is its price. A red-that-should-be-green is
  # worse than a slow green. `workers: 1` (playwright.config.ts) is load-bearing
  # here, not incidental.
  #
  # timeout RAISED 20 -> 35 -> 50. TWICE NOW, and the second time is not the same
  # cause as the first, which is the thing worth recording.
  #
  #   20 -> 35 [S134]: #197 hit the old 20-minute cap un-sharded. That was the
  #                    suite being un-sharded — a one-off step change.
  #   35 -> 50 [S165]: every run since the M5/M6-fixes merge (dc1e80c onward —
  #                    S163's fixes, all three M9 merges, the tools commit,
  #                    fd9ec3e) was CANCELLED at the 35-min cap. Measured from
  #                    the Actions API, the "Run Playwright tests" step went
  #                    23m32s (feb62ae, last green) -> >32m35s (cancelled,
  #                    unfinished) — a >38% jump. But the e2e suite gained only
  #                    ~2 tests over that span; what grew was 13 MIGRATIONS
  #                    (+2,920 lines of SQL: S163 x6, M9 x5, +2). The cost is
  #                    PER-STATEMENT DB overhead — more RLS policies and triggers
  #                    on the one shared rebuild-test DB that this serial suite
  #                    round-trips thousands of times — NOT more tests. So this
  #                    ceiling will keep being outgrown as modules add policy,
  #                    and raising it is a treadmill, not a fix.
  #
  # 50 is deliberately generous: because every run has been capped, the TRUE
  # full duration is unknown (only "> 32m35s"). 50 lets the next run finish AND
  # finally measure it, which is the number Josh needs to rule on the durable
  # fix. Lower it once that number exists. Headroom to measure, not a target.
  #
  # NOT THE EVENTUAL ANSWER. A database PER SHARD (safe by construction) is, and
  # it is BLOCKED on a reproducible seed that does not exist — the pinned
  # fixtures are hand-curated on rebuild-test. See TECH_DEBT. The sharding work
  # is correct and kept on branch `ci/shard-playwright` for when that seed
  # lands; this revert does not delete it.
  #
  # RETRIES ARE UNTOUCHED, DELIBERATELY. `retries: process.env.CI ? 2` stays.
  # Under serial execution there is nothing cross-test to mask, so retries are
  # safe and useful. Whether CI should retry at all is a live, unruled question
  # that predates sharding and is not folded into this change.
  #
  # ---------------------------------------------------------------------------
  # PER-TEST TIMEOUT RAISED 30s -> 60s IN CI [S107, RULED Josh]
  # ---------------------------------------------------------------------------
  # The value lives in `apps/web/playwright.config.ts`
  # (`timeout: (process.env.CI ? 60 : 30) * 1000`); the reasoning lives HERE,
  # with the sharding and job-timeout reasoning it belongs beside.
  #
  # WHAT WAS HAPPENING. The suite ran on Playwright's 30s default. CI averaged
  # ~20s/test against it, so the most expensive specs — sign in, navigate, open
  # a panel, fetch, click — tipped over, and WHICH ones tipped varied run to
  # run. That non-determinism is why the red was misread as a chat-feature
  # problem for four merges. Measured at S107 under full-suite conditions, the
  # chat photo tests took 23-24s LOCALLY; CI is slower still.
  #
  # WHY NOT THE OTHER TWO OPTIONS. Both were already ruled out above and the
  # ruling stands: `workers > 1` and sharding each reintroduce the intra-DB
  # concurrency behind CI #201, and `workers: 1` is load-bearing, not
  # incidental. Raising the per-test budget is the only lever that does not
  # touch concurrency.
  #
  # COST: NOTHING ON A GREEN RUN. A passing test never spends its budget. It
  # costs only on genuine failures — up to 60s instead of 30s before each of
  # the 2 retries — against the 50-minute job cap, which has headroom.
  #
  # ⚠️ CAVEAT 1 — THIS IS A TREADMILL, NOT A FIX.
  # It is the same treadmill the 20 -> 35 -> 50 job-timeout history above
  # records, one level down. What grows is PER-STATEMENT DB OVERHEAD from
  # accumulating RLS policies and triggers on the one shared rebuild-test
  # database this serial suite round-trips thousands of times — NOT the number
  # of tests. A future session finding this budget exhausted again should
  # FIX THE CAUSE rather than raise this number a second time. If you are here
  # to change 60 to 90, you are on the treadmill: stop and read the durable fix
  # below.
  #
  # ⚠️ CAVEAT 2 — IT WEAKENS A REAL SIGNAL, DELIBERATELY.
  # A test that legitimately takes 45 seconds now PASSES SILENTLY where it used
  # to fail. That is a genuine loss of information about the app getting
  # slower, accepted here because the alternative was a suite too noisy to read
  # at all. It means a slow-page regression will not announce itself in this
  # suite any more; it will have to be caught by the latency work instead.
  #
  # THE DURABLE FIX, WHICH THIS IS NOT: A DATABASE PER SHARD — safe by
  # construction, because per-shard fixture isolation removes the intra-DB
  # concurrency that forces `workers: 1` in the first place. It remains the
  # recorded answer and it remains BLOCKED on a reproducible seed that does not
  # exist: the pinned fixtures are hand-curated on rebuild-test. The sharding
  # work is correct and kept on branch `ci/shard-playwright` for when that seed
  # lands.
  #
  # JOB NAME `E2E (Playwright)` PRESERVED. A required status check may be pinned
  # to it; branch protection could not be read (403 Resource not accessible by
  # integration), so the name is kept rather than gambled on.
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # NO CACHE STEP ON THE BROWSER BINARIES, AND THAT IS DELIBERATE.
      # Playwright's own CI guidance: "Caching browser binaries is not
      # recommended, since the amount of time it takes to restore the cache is
      # comparable to the time it takes to download the binaries. Especially
      # under Linux, operating system dependencies need to be installed, which
      # are not cacheable."
      #
      # That second sentence is the decisive one, and it is not theoretical —
      # it is exactly what bit this repo's Codespace: the binaries downloaded
      # fine and Chromium still would not launch (`libnspr4.so: cannot open
      # shared object file`) until the apt packages were installed. A cache
      # would have restored the binaries and reproduced that failure every run.
      #
      # `--with-deps` installs those apt packages. `chromium` only — Firefox and
      # WebKit would roughly triple the download for browsers nothing asserts
      # against yet. If that changes, add them to playwright.config.ts projects
      # AND here, together.
      - name: Install Playwright browsers + system deps
        run: npx playwright install --with-deps chromium
        working-directory: apps/web

      # #135 — BUILD IS ITS OWN STEP, AND THAT SEPARATION IS THE POINT.
      #
      # CI serves a PRODUCTION build (playwright.config.ts picks `npm run start`
      # when process.env.CI is set). The build could have been folded into that
      # webServer command as `npm run build && npm run start`, and that would
      # have been the wrong shape: a compile error would then surface as
      # `Timed out waiting 60000ms from config.webServer`, naming the web server
      # instead of the broken file. That misreporting IS #135. Here, a broken
      # build fails this step with the compiler's own output.
      #
      # SECRETS ARE REQUIRED HERE TOO. `next build` prerenders static routes and
      # evaluates middleware, both of which construct a Supabase client from
      # these vars — see #131 for what their absence does to the whole suite.
      - name: Build (production)
        run: npm run build
        working-directory: apps/web
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      # Playwright starts `next start` (webServer). Nothing is compiled on
      # demand, so the 60s webServer budget is generous rather than tight —
      # production boots in ~2s locally. reuseExistingServer is false under CI,
      # so this always gets a fresh server rather than silently testing a stale
      # one.
      # SUPABASE_SERVICE_ROLE_KEY IS REQUIRED, AND IT SERVES TWO CONSUMERS.
      #
      # 1. THE FIXTURES. e2e/hub-fixture.ts builds a service-role client: it
      #    inserts projects, punch items, schedule rows and assignments that no
      #    member JWT could write, and hard-deletes them in teardown. Without
      #    the key it throws in `beforeAll` and every spec that imports it dies
      #    before its first assertion — which is what made #186 and #187 red.
      #
      # 2. THE SERVER UNDER TEST. Playwright's webServer inherits this step's
      #    environment, so `next start` gets it too. Routes built on
      #    lib/supabase-admin.ts — /api/change-orders/[id]/recalculate, which
      #    m-co-recalc-route.spec.ts calls over real HTTP, plus the deliveries,
      #    daily-log and safety-incident routes — construct that client at
      #    REQUEST time. Lazy init keeps the build green without it and then
      #    fails at the only point that matters.
      #
      # SCOPE: this is framefocus-rebuild-test's key, never production's. The
      # fixture refuses outright unless NEXT_PUBLIC_SUPABASE_URL contains
      # nmyphyhmfttxkdoposvf, so a URL/key pair from any other project fails
      # closed rather than writing somewhere it should not.
      #
      # NOT ON THE BUILD STEP ABOVE, deliberately: `next build` prerenders and
      # evaluates middleware, neither of which reaches an admin client, and a
      # secret not handed to a step cannot leak from it.
      - name: Run Playwright tests
        run: npx playwright test
        working-directory: apps/web
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # Uploaded on failure only — a green run's report is noise, a red one is
      # the trace and screenshot that explain it.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 14
