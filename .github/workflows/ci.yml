name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# ⚠️ TECH_DEBT #137 [S122] — EVERY `run:` STEP GETS `pipefail`.
#
# GitHub's default shell for `run:` is `bash -e {0}`: NO `pipefail`. So any step
# that pipes — `npx next build | tail -20` is the instance that actually shipped
# — is judged by the LAST command's status. `tail` always exits 0, so a failed
# build reports success and the job goes GREEN. Locally that costs a re-run; in
# CI it ships red as green, the branch looks mergeable, and nothing downstream
# re-checks.
#
# `-o pipefail` makes a pipeline fail if ANY stage fails. `-u` fails on an unset
# variable rather than silently substituting empty — the same class of defect
# (a typo'd secret name becoming ""). `{0}` is the script path GitHub
# substitutes; it must be kept.
#
# This closes the PIPE half of #137 workflow-wide. It does NOT close the
# trailing-command half — `cmd; echo "exit: $?"` still reports the echo's
# status, and nothing but not writing it fixes that. See CLAUDE.md → "Reading
# the exit status of a command" for the rules that apply to every command run
# in this repo, CI or not.
defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  check:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint web
        run: npx turbo run lint --filter=@framefocus/web

      # ADDED [S99]. The committed vitest suite (297 tests) was not running in
      # CI at all — this job did type-check and lint only. Nothing about
      # Playwright required fixing that, but adding a second test surface while
      # the first one never ran would have been the wrong shape. Cheap: no
      # browser, no server, no secrets.
      - name: Unit tests (vitest)
        run: npx turbo run test --filter=@framefocus/web

  # ---------------------------------------------------------------------------
  # SEPARATE JOB, deliberately.
  #
  # e2e needs ~656 MB of browser binaries, Chromium's system libraries, and a
  # running Next dev server. `check` needs none of that and finishes in a
  # fraction of the time. Folding them together would make every lint failure
  # wait on a browser download, and would let an e2e flake mask a type error.
  # Separate jobs also run in parallel.
  # ---------------------------------------------------------------------------
  # ---------------------------------------------------------------------------
  # SHARDED [S133]. #197 was CANCELLED AT THE 20-MINUTE CAP with nothing failing.
  # ---------------------------------------------------------------------------
  # Every mark in that log was a pass or a skip — it died around 400 of 497 tests
  # on wall clock alone. The same suite runs locally in this exact configuration
  # (production build, `npm run start`, one worker) in 14.3 minutes; GitHub's
  # runner is slower and the suite grew as chat and the roster work landed.
  #
  # RAISING `timeout-minutes` WAS THE ALTERNATIVE AND WAS REJECTED [Josh, S133]:
  # it buys headroom the suite consumes again. Sharding divides the work instead.
  #
  # ⚠️ THE SHARD COUNT IS DECLARED ONCE, in the matrix below. `--shard` reads it
  # back as `strategy.job-total`, so changing the matrix changes both halves and
  # they cannot drift into `--shard=3/4` running on a 5-way matrix — which does
  # not error, it silently never runs a quarter of the suite.
  #
  # PLAYWRIGHT SHARDS BY FILE, verified against 1.62.1 rather than assumed:
  # listing all four shards, the only file appearing in more than one is
  # `auth.setup.ts`, which is the setup project every shard depends on. So a
  # single spec file is never split across runners — which matters for
  # `m-writes.spec.ts`, whose known order-dependent test ("an OWNER edits both
  # halves") stays with the rest of its file. Sharding changes the order files
  # run in, not the order within one. Distribution measured: 125 / 141 / 128 /
  # 106 tests.
  #
  # WHAT IS DELIBERATELY NOT CHANGED HERE — one variable at a time:
  #   · `workers` stays at 1 under CI (playwright.config.ts).
  #   · `retries` is untouched. ⚠️ NOTE FOR THE READER: the config sets
  #     `retries: process.env.CI ? 2 : 0`, so CI DOES retry twice. That is what
  #     produced #194's `1 flaky`, which masked the m-writes ordering problem.
  #     The `--retries=0` figure quoted for the 14.3-minute local run was a
  #     LOCAL override, not CI's behaviour. Changing it is a real decision about
  #     what CI hides and belongs in its own change, not smuggled into sharding.
  e2e:
    name: E2E shard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # A failing shard must not cancel its siblings: the merged report is only
      # readable if every shard finished, and one shard's failure should not
      # hide a second one in another.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # NO CACHE STEP ON THE BROWSER BINARIES, AND THAT IS DELIBERATE.
      # Playwright's own CI guidance: "Caching browser binaries is not
      # recommended, since the amount of time it takes to restore the cache is
      # comparable to the time it takes to download the binaries. Especially
      # under Linux, operating system dependencies need to be installed, which
      # are not cacheable."
      #
      # That second sentence is the decisive one, and it is not theoretical —
      # it is exactly what bit this repo's Codespace: the binaries downloaded
      # fine and Chromium still would not launch (`libnspr4.so: cannot open
      # shared object file`) until the apt packages were installed. A cache
      # would have restored the binaries and reproduced that failure every run.
      #
      # `--with-deps` installs those apt packages. `chromium` only — Firefox and
      # WebKit would roughly triple the download for browsers nothing asserts
      # against yet. If that changes, add them to playwright.config.ts projects
      # AND here, together.
      - name: Install Playwright browsers + system deps
        run: npx playwright install --with-deps chromium
        working-directory: apps/web

      # #135 — BUILD IS ITS OWN STEP, AND THAT SEPARATION IS THE POINT.
      #
      # CI serves a PRODUCTION build (playwright.config.ts picks `npm run start`
      # when process.env.CI is set). The build could have been folded into that
      # webServer command as `npm run build && npm run start`, and that would
      # have been the wrong shape: a compile error would then surface as
      # `Timed out waiting 60000ms from config.webServer`, naming the web server
      # instead of the broken file. That misreporting IS #135. Here, a broken
      # build fails this step with the compiler's own output.
      #
      # SECRETS ARE REQUIRED HERE TOO. `next build` prerenders static routes and
      # evaluates middleware, both of which construct a Supabase client from
      # these vars — see #131 for what their absence does to the whole suite.
      - name: Build (production)
        run: npm run build
        working-directory: apps/web
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      # Playwright starts `next start` (webServer). Nothing is compiled on
      # demand, so the 60s webServer budget is generous rather than tight —
      # production boots in ~2s locally. reuseExistingServer is false under CI,
      # so this always gets a fresh server rather than silently testing a stale
      # one.
      # SUPABASE_SERVICE_ROLE_KEY IS REQUIRED, AND IT SERVES TWO CONSUMERS.
      #
      # 1. THE FIXTURES. e2e/hub-fixture.ts builds a service-role client: it
      #    inserts projects, punch items, schedule rows and assignments that no
      #    member JWT could write, and hard-deletes them in teardown. Without
      #    the key it throws in `beforeAll` and every spec that imports it dies
      #    before its first assertion — which is what made #186 and #187 red.
      #
      # 2. THE SERVER UNDER TEST. Playwright's webServer inherits this step's
      #    environment, so `next start` gets it too. Routes built on
      #    lib/supabase-admin.ts — /api/change-orders/[id]/recalculate, which
      #    m-co-recalc-route.spec.ts calls over real HTTP, plus the deliveries,
      #    daily-log and safety-incident routes — construct that client at
      #    REQUEST time. Lazy init keeps the build green without it and then
      #    fails at the only point that matters.
      #
      # SCOPE: this is framefocus-rebuild-test's key, never production's. The
      # fixture refuses outright unless NEXT_PUBLIC_SUPABASE_URL contains
      # nmyphyhmfttxkdoposvf, so a URL/key pair from any other project fails
      # closed rather than writing somewhere it should not.
      #
      # NOT ON THE BUILD STEP ABOVE, deliberately: `next build` prerenders and
      # evaluates middleware, neither of which reaches an admin client, and a
      # secret not handed to a step cannot leak from it.
      #
      # EACH SHARD GETS ITS OWN SERVER, AND NOTHING HAD TO CHANGE FOR THAT.
      # A matrix job is a separate runner, so every shard has its own localhost
      # and its own :3000 — they cannot collide with each other. `webServer`
      # starts one per shard, and `reuseExistingServer` is already false under
      # CI, so each gets a fresh `next start` rather than a stale one.
      # `scripts/e2e-preflight.sh` is deliberately NOT involved: it is a local
      # guard against `npm run dev` sliding to 3001 on a busy Codespace, and it
      # is not referenced anywhere in this workflow. Confirmed by grep, because
      # that port slide has cost two full runs before.
      #
      # `--reporter=blob` REPLACES the config's CI reporters for this step. Blob
      # is the only format `merge-reports` can recombine; the github annotations
      # and the HTML both come back out of the merge job below, so nothing is
      # lost by not emitting them here — and emitting an HTML report per shard
      # would give four partial reports and no whole one.
      - name: Run Playwright tests (shard ${{ matrix.shard }}/${{ strategy.job-total }})
        run: npx playwright test --shard=${{ matrix.shard }}/${{ strategy.job-total }} --reporter=blob
        working-directory: apps/web
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # ALWAYS, not `if: failure()`. The merge job needs every shard's blob to
      # produce one report, including the green ones — uploading only on failure
      # would give a merged report containing just the shard that broke.
      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shard }}
          path: apps/web/blob-report/
          retention-days: 3

  # ---------------------------------------------------------------------------
  # THE GATE, AND THE ONE READABLE REPORT.
  # ---------------------------------------------------------------------------
  # ⚠️ THIS JOB KEEPS THE NAME `E2E (Playwright)` ON PURPOSE. That was the e2e
  # job's name before sharding, and a required status check configured on it
  # would silently stop being satisfied if the name vanished — a branch would
  # then wait forever on a check that no longer exists. I could NOT read the
  # branch protection to confirm whether such a rule exists: the API returns
  # 403 `Resource not accessible by integration` for this token. So the name is
  # preserved rather than gambled on.
  #
  # ⚠️ AND IT MUST GO RED WHEN A SHARD DOES. `merge-reports` succeeds whether or
  # not the tests it merges passed — it is a report tool, not a gate. Without
  # the explicit check at the end, this job would be green over a failed shard,
  # and a matrix that reports green because a shard errored is worse than the
  # timeout it replaced. `needs.e2e.result` is the aggregate of the whole
  # matrix: `success` only if every shard succeeded.
  merge-reports:
    name: E2E (Playwright)
    if: ${{ !cancelled() }}
    needs: [e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Download blob reports
        uses: actions/download-artifact@v4
        with:
          path: apps/web/all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge into one HTML report
        run: npx playwright merge-reports --reporter=html,github ./all-blob-reports
        working-directory: apps/web
        env:
          PLAYWRIGHT_HTML_OPEN: never

      - name: Upload merged report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 14

      # LAST, so the report is uploaded before this fails the job.
      - name: Fail if any shard failed
        if: ${{ needs.e2e.result != 'success' }}
        run: |
          echo "Playwright matrix result: ${{ needs.e2e.result }}"
          echo "Open the 'playwright-report' artifact — it is the MERGED report for all shards."
          exit 1
