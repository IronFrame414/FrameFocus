name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# ⚠️ TECH_DEBT #137 [S122] — EVERY `run:` STEP GETS `pipefail`.
#
# GitHub's default shell for `run:` is `bash -e {0}`: NO `pipefail`. So any step
# that pipes — `npx next build | tail -20` is the instance that actually shipped
# — is judged by the LAST command's status. `tail` always exits 0, so a failed
# build reports success and the job goes GREEN. Locally that costs a re-run; in
# CI it ships red as green, the branch looks mergeable, and nothing downstream
# re-checks.
#
# `-o pipefail` makes a pipeline fail if ANY stage fails. `-u` fails on an unset
# variable rather than silently substituting empty — the same class of defect
# (a typo'd secret name becoming ""). `{0}` is the script path GitHub
# substitutes; it must be kept.
#
# This closes the PIPE half of #137 workflow-wide. It does NOT close the
# trailing-command half — `cmd; echo "exit: $?"` still reports the echo's
# status, and nothing but not writing it fixes that. See CLAUDE.md → "Reading
# the exit status of a command" for the rules that apply to every command run
# in this repo, CI or not.
defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  check:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint web
        run: npx turbo run lint --filter=@framefocus/web

      # ADDED [S99]. The committed vitest suite (297 tests) was not running in
      # CI at all — this job did type-check and lint only. Nothing about
      # Playwright required fixing that, but adding a second test surface while
      # the first one never ran would have been the wrong shape. Cheap: no
      # browser, no server, no secrets.
      - name: Unit tests (vitest)
        run: npx turbo run test --filter=@framefocus/web

  # ---------------------------------------------------------------------------
  # SEPARATE JOB, deliberately.
  #
  # e2e needs ~656 MB of browser binaries, Chromium's system libraries, and a
  # running Next dev server. `check` needs none of that and finishes in a
  # fraction of the time. Folding them together would make every lint failure
  # wait on a browser download, and would let an e2e flake mask a type error.
  # Separate jobs also run in parallel.
  # ---------------------------------------------------------------------------
  # ---------------------------------------------------------------------------
  # UN-SHARDED, DELIBERATELY — the sharding of S133 was REVERTED. [Josh, S134]
  # ---------------------------------------------------------------------------
  # Sharding (S133, commit ce6efa8) ran four runners against the ONE shared
  # rebuild-test database. To that database the four shards are CONCURRENT runs,
  # which is the exact hazard #198/#199/#200 were sequenced to avoid — carried,
  # unnoticed, across the shard boundary. It surfaced as CI #201: a PM-authored
  # `net_delta:0` change order created by `m-co-recalc-route.spec.ts` on shard N
  # was read by `desktop-payload.spec.ts:175` on shard 1, failing an
  # assert-absence. Not a payload leak — a test that asserts the ABSENCE / count
  # of something another shard writes to a shared fixture. See TECH_DEBT for the
  # full exposed set.
  #
  # THE REASONING, so it is not re-litigated: the only two speedups available —
  # sharding, and `workers > 1` in one job — BOTH introduce that same intra-DB
  # concurrency. Absent per-shard fixture isolation, SERIAL is the only correct
  # configuration and the wall-clock is its price. A red-that-should-be-green is
  # worse than a slow green. `workers: 1` (playwright.config.ts) is load-bearing
  # here, not incidental.
  #
  # timeout RAISED 20 -> 35: #197 hit the old 20-minute cap un-sharded; local is
  # ~14.3 min and GitHub's runner is slower. 35 is headroom, not a target.
  #
  # NOT THE EVENTUAL ANSWER. A database PER SHARD (safe by construction) is, and
  # it is BLOCKED on a reproducible seed that does not exist — the pinned
  # fixtures are hand-curated on rebuild-test. See TECH_DEBT. The sharding work
  # is correct and kept on branch `ci/shard-playwright` for when that seed
  # lands; this revert does not delete it.
  #
  # RETRIES ARE UNTOUCHED, DELIBERATELY. `retries: process.env.CI ? 2` stays.
  # Under serial execution there is nothing cross-test to mask, so retries are
  # safe and useful. Whether CI should retry at all is a live, unruled question
  # that predates sharding and is not folded into this change.
  #
  # JOB NAME `E2E (Playwright)` PRESERVED. A required status check may be pinned
  # to it; branch protection could not be read (403 Resource not accessible by
  # integration), so the name is kept rather than gambled on.
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # NO CACHE STEP ON THE BROWSER BINARIES, AND THAT IS DELIBERATE.
      # Playwright's own CI guidance: "Caching browser binaries is not
      # recommended, since the amount of time it takes to restore the cache is
      # comparable to the time it takes to download the binaries. Especially
      # under Linux, operating system dependencies need to be installed, which
      # are not cacheable."
      #
      # That second sentence is the decisive one, and it is not theoretical —
      # it is exactly what bit this repo's Codespace: the binaries downloaded
      # fine and Chromium still would not launch (`libnspr4.so: cannot open
      # shared object file`) until the apt packages were installed. A cache
      # would have restored the binaries and reproduced that failure every run.
      #
      # `--with-deps` installs those apt packages. `chromium` only — Firefox and
      # WebKit would roughly triple the download for browsers nothing asserts
      # against yet. If that changes, add them to playwright.config.ts projects
      # AND here, together.
      - name: Install Playwright browsers + system deps
        run: npx playwright install --with-deps chromium
        working-directory: apps/web

      # #135 — BUILD IS ITS OWN STEP, AND THAT SEPARATION IS THE POINT.
      #
      # CI serves a PRODUCTION build (playwright.config.ts picks `npm run start`
      # when process.env.CI is set). The build could have been folded into that
      # webServer command as `npm run build && npm run start`, and that would
      # have been the wrong shape: a compile error would then surface as
      # `Timed out waiting 60000ms from config.webServer`, naming the web server
      # instead of the broken file. That misreporting IS #135. Here, a broken
      # build fails this step with the compiler's own output.
      #
      # SECRETS ARE REQUIRED HERE TOO. `next build` prerenders static routes and
      # evaluates middleware, both of which construct a Supabase client from
      # these vars — see #131 for what their absence does to the whole suite.
      - name: Build (production)
        run: npm run build
        working-directory: apps/web
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      # Playwright starts `next start` (webServer). Nothing is compiled on
      # demand, so the 60s webServer budget is generous rather than tight —
      # production boots in ~2s locally. reuseExistingServer is false under CI,
      # so this always gets a fresh server rather than silently testing a stale
      # one.
      # SUPABASE_SERVICE_ROLE_KEY IS REQUIRED, AND IT SERVES TWO CONSUMERS.
      #
      # 1. THE FIXTURES. e2e/hub-fixture.ts builds a service-role client: it
      #    inserts projects, punch items, schedule rows and assignments that no
      #    member JWT could write, and hard-deletes them in teardown. Without
      #    the key it throws in `beforeAll` and every spec that imports it dies
      #    before its first assertion — which is what made #186 and #187 red.
      #
      # 2. THE SERVER UNDER TEST. Playwright's webServer inherits this step's
      #    environment, so `next start` gets it too. Routes built on
      #    lib/supabase-admin.ts — /api/change-orders/[id]/recalculate, which
      #    m-co-recalc-route.spec.ts calls over real HTTP, plus the deliveries,
      #    daily-log and safety-incident routes — construct that client at
      #    REQUEST time. Lazy init keeps the build green without it and then
      #    fails at the only point that matters.
      #
      # SCOPE: this is framefocus-rebuild-test's key, never production's. The
      # fixture refuses outright unless NEXT_PUBLIC_SUPABASE_URL contains
      # nmyphyhmfttxkdoposvf, so a URL/key pair from any other project fails
      # closed rather than writing somewhere it should not.
      #
      # NOT ON THE BUILD STEP ABOVE, deliberately: `next build` prerenders and
      # evaluates middleware, neither of which reaches an admin client, and a
      # secret not handed to a step cannot leak from it.
      - name: Run Playwright tests
        run: npx playwright test
        working-directory: apps/web
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # Uploaded on failure only — a green run's report is noise, a red one is
      # the trace and screenshot that explain it.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 14
