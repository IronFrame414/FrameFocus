        renderVals() {
          const active = Number(this.props.active ?? 12);
          const base = "display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:9px;font-size:14px;";
          const on = base + "background:#3b4ae0;color:#fff;font-weight:600;box-shadow:inset 0 0 0 1.5px #7d8bf5";
          const off = base + "color:#aeb8cf;font-weight:500";
          const v = {};
          for (let i = 0; i < 14; i++) v["s" + i] = (i === active ? on : off);
          return v;
